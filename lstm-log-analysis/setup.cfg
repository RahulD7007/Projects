# setup.cfg
[flake8]
max-line-length = 100
exclude = .venv, __pycache__, .pytest_cache, build, dist
ignore = E203, W503

[tool:pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -v --tb=short

[metadata]
name = lstm-log-analysis
version = 1.0.0
description = DeepLog LSTM System Log Anomaly Detection