# pyproject.toml
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lstm-log-analysis"
version = "1.0.0"
description = "Production DeepLog LSTM for System Log Anomaly Detection"
requires-python = ">=3.10"
authors = [{name = "Your Name", email = "you@example.com"}]
license = {text = "MIT"}
readme = "README.md"

dependencies = [
    "tensorflow>=2.12.0",
    "numpy>=1.23.5",
    "pandas>=1.5.3",
    "scikit-learn>=1.2.2",
    "matplotlib>=3.7.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.3.1", "flake8>=6.0.0"]