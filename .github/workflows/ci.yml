name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      # 3. Install dependencies (safe if requirements.txt is missing)
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install pytest ruff

      # 4. Lint code with Ruff (won't fail if folders missing)
      - name: Lint Code with Ruff
        run: |
          ruff check src/ tests/ || echo "⚠️ Lint warnings found, continuing..."
        continue-on-error: true

      # 5. Run tests (skip gracefully if no tests exist)
      - name: Run Pytest Unit & Integration Tests
        run: |
          if [ -d tests ] && [ "$(ls -A tests)" ]; then
            pytest tests/ -v
          else
            echo "⚠️ No tests found, skipping."
          fi

      # 6. Run end-to-end pipeline (only if modules exist)
      - name: Verify End-to-End Pipeline
        run: |
          for module in dataset features train predict reports; do
            if [ -f "src/${module}.py" ]; then
              echo "▶ Running src.${module}"
              python -m src.${module} || echo "⚠️ src.${module} failed, continuing..."
            else
              echo "⏭ Skipping src.${module} (file not found)"
            fi
          done
        continue-on-error: true

  docker-build-and-push:
    needs: build-and-test
    runs-on: ubuntu-latest
    # Only push Docker image on main/master branch (not on PRs)
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            nitins1/ml-eda-full-fledge:latest
            nitins1/ml-eda-full-fledge:${{ github.sha }}
