name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install pytest ruff

      - name: Lint Code with Ruff
        run: |
          ruff check src/ tests/ || echo "⚠️ Lint warnings found, continuing..."
        continue-on-error: true

      - name: Run Pytest Unit & Integration Tests
        run: |
          if [ -d tests ] && [ "$(ls -A tests)" ]; then
            pytest tests/ -v
          else
            echo "⚠️ No tests found, skipping."
          fi

      - name: Verify End-to-End Pipeline
        run: |
          for module in dataset features train predict reports; do
            if [ -f "src/${module}.py" ]; then
              echo "▶ Running src.${module}"
              python -m src.${module} || echo "⚠️ src.${module} failed, continuing..."
            else
              echo "⏭ Skipping src.${module} (file not found)"
            fi
          done
        continue-on-error: true

  docker-build:
    needs: build-and-test
    runs-on: ubuntu-latest
    # Only build Docker if Dockerfile exists
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check if Dockerfile exists
        id: check_docker
        run: |
          if [ -f Dockerfile ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "⚠️ No Dockerfile found, skipping Docker build."
          fi

      - name: Set up Docker Buildx
        if: steps.check_docker.outputs.exists == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.check_docker.outputs.exists == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        if: steps.check_docker.outputs.exists == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            nitins1/ml-eda-full-fledge:latest
            nitins1/ml-eda-full-fledge:${{ github.sha }}
